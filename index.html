<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Cocktail Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0221;
    --bg-panel:#170a30;
    --bg-panel-2:#1f0e3d;
    --pink:#ff2e6c;
    --cyan:#00e8ff;
    --yellow:#ffe45e;
    --green:#39ff88;
    --purple:#8a4fff;
    --grid:#4b1f7a;
    --text:#e9e6f7;
    --dim:#9186b8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'VT323', monospace;
    font-size:19px;
    line-height:1.35;
    min-height:100vh;
    overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3,.pixel{
    font-family:'Press Start 2P', monospace;
    letter-spacing:.5px;
  }
  #scanlines{
    position:fixed; inset:0; pointer-events:none; z-index:50;
    background:repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,.18) 3px
    );
    mix-blend-mode:multiply;
  }
  #vignette{
    position:fixed; inset:0; pointer-events:none; z-index:49;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%);
  }
  #app{
    position:relative;
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    padding:14px 14px 40px;
  }

  /* ---------- HUD ---------- */
  .hud{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--bg-panel);
    border:2px solid var(--purple);
    box-shadow:0 0 0 2px var(--bg), 0 0 12px rgba(138,79,255,.5);
    padding:8px 10px;
    margin-bottom:16px;
    font-family:'Press Start 2P', monospace;
    font-size:9px;
    color:var(--cyan);
  }
  .hud .hud-item{display:flex; flex-direction:column; gap:4px; align-items:center;}
  .hud .hud-label{color:var(--dim); font-size:8px;}
  .hud button{
    background:var(--bg-panel-2); color:var(--yellow); border:2px solid var(--yellow);
    font-family:'Press Start 2P', monospace; font-size:10px; width:26px; height:26px;
    cursor:pointer;
  }
  .hud button:active{transform:translateY(1px);}
  .hud .val{color:var(--yellow); font-size:13px;}

  /* ---------- Title screen ---------- */
  .title-screen{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:80vh; text-align:center; gap:28px;
  }
  .logo{
    font-size:clamp(22px,7vw,32px);
    color:var(--pink);
    text-shadow:
      0 0 6px var(--pink),
      0 0 18px var(--pink),
      3px 3px 0 var(--cyan);
    animation:flicker 3.2s infinite;
    line-height:1.6;
  }
  .logo span{color:var(--cyan); text-shadow:0 0 6px var(--cyan), 0 0 18px var(--cyan), -3px 3px 0 var(--pink);}
  @keyframes flicker{
    0%,100%{opacity:1;}
    92%{opacity:1;}
    93%{opacity:.6;}
    94%{opacity:1;}
    96%{opacity:.75;}
    97%{opacity:1;}
  }
  .grid-floor{
    width:100%; height:120px;
    background:
      linear-gradient(to top, rgba(255,46,108,.35), transparent 70%),
      repeating-linear-gradient(90deg, var(--grid) 0 2px, transparent 2px 40px);
    -webkit-mask-image:linear-gradient(to top, black, transparent);
            mask-image:linear-gradient(to top, black, transparent);
    position:relative;
  }
  .sun{
    width:90px; height:90px; border-radius:50%;
    background:linear-gradient(to top, var(--pink), var(--yellow));
    margin:0 auto -20px;
    box-shadow:0 0 40px rgba(255,46,108,.6);
  }
  .press-start{
    font-family:'Press Start 2P', monospace;
    font-size:12px; color:var(--yellow);
    animation:blink 1.1s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0;}}
  .coin-btn{
    background:var(--pink); color:#fff; border:none;
    font-family:'Press Start 2P', monospace; font-size:12px;
    padding:14px 22px; cursor:pointer;
    box-shadow:0 4px 0 #9c0034, 0 0 20px rgba(255,46,108,.6);
  }
  .coin-btn:active{transform:translateY(4px); box-shadow:0 0 0 #9c0034;}
  .loading-txt{color:var(--dim); font-size:14px;}

  /* ---------- Menu ---------- */
  .menu-title{color:var(--yellow); font-size:14px; text-align:center; margin-bottom:18px;}
  .menu-btn{
    display:block; width:100%; text-align:left;
    background:var(--bg-panel); color:var(--text);
    border:2px solid var(--cyan);
    box-shadow:4px 4px 0 var(--cyan);
    padding:16px 14px; margin-bottom:20px; cursor:pointer;
    font-family:'Press Start 2P', monospace; font-size:12px;
  }
  .menu-btn:active{transform:translate(4px,4px); box-shadow:0 0 0 var(--cyan);}
  .menu-btn.pink{border-color:var(--pink); box-shadow:4px 4px 0 var(--pink);}
  .menu-btn.pink:active{box-shadow:0 0 0 var(--pink);}
  .menu-btn.yellow{border-color:var(--yellow); box-shadow:4px 4px 0 var(--yellow);}
  .menu-btn.yellow:active{box-shadow:0 0 0 var(--yellow);}
  .menu-btn.green{border-color:var(--green); box-shadow:4px 4px 0 var(--green);}
  .menu-btn.green:active{box-shadow:0 0 0 var(--green);}
  .menu-btn .sub{
    font-family:'VT323', monospace; font-size:16px; color:var(--dim); margin-top:8px; display:block;
  }

  /* ---------- Generic screen header ---------- */
  .screen-header{
    display:flex; align-items:center; gap:10px; margin-bottom:16px;
  }
  .back-btn{
    background:var(--bg-panel); color:var(--pink); border:2px solid var(--pink);
    font-family:'Press Start 2P', monospace; font-size:10px; padding:8px 10px; cursor:pointer;
  }
  .back-btn:active{transform:translateY(2px);}
  .screen-title{color:var(--cyan); font-size:13px; text-shadow:0 0 8px rgba(0,232,255,.6);}

  /* ---------- Inventory ---------- */
  .inv-cat{color:var(--yellow); font-size:11px; margin:18px 0 8px;}
  .inv-row{
    display:flex; align-items:center; gap:10px;
    background:var(--bg-panel); border:1px solid var(--grid);
    padding:9px 10px; margin-bottom:6px;
  }
  .inv-row input{width:20px; height:20px; accent-color:var(--green);}
  .inv-row label{flex:1; font-size:18px;}
  .inv-row.checked{border-color:var(--green);}
  .inv-note{color:var(--dim); font-size:15px; margin-top:14px;}

  /* ---------- Cocktail list ---------- */
  .cocktail-card{
    background:var(--bg-panel); border:2px solid var(--grid);
    padding:12px; margin-bottom:12px; cursor:pointer;
    display:flex; justify-content:space-between; align-items:center; gap:10px;
  }
  .cocktail-card.ready{border-color:var(--green); box-shadow:0 0 10px rgba(57,255,136,.25);}
  .cocktail-card:active{transform:scale(.98);}
  .cc-name{font-family:'Press Start 2P', monospace; font-size:11px; margin-bottom:6px;}
  .cc-missing{color:var(--dim); font-size:15px;}
  .badge{
    font-family:'Press Start 2P', monospace; font-size:8px; padding:5px 7px;
    white-space:nowrap; flex-shrink:0;
  }
  .badge.ready{background:var(--green); color:#04240f;}
  .badge.locked{background:var(--pink); color:#3a0013;}

  /* ---------- Cocktail detail / play screen ---------- */
  .glass-row{display:flex; justify-content:center; align-items:flex-end; gap:14px; margin:52px 0 6px;}
  .glass{
    position:relative; width:110px; height:130px; flex-shrink:0;
    border:4px solid var(--cyan);
    border-top:none;
    background:rgba(255,255,255,.03);
    overflow:hidden;
    box-shadow:0 0 16px rgba(0,232,255,.35);
  }
  .glass.shape-coupe{
    width:130px; height:90px;
    border-radius:0 0 70px 70px / 0 0 90px 90px;
    border-top:none;
  }
  .glass.shape-highball{width:80px; height:150px;}
  .layer{
    position:absolute; left:0; right:0;
    transition:height .5s ease, bottom .5s ease;
  }
  .ice{
    position:absolute; left:0; right:0; z-index:3;
    --ice-h:30px;
    bottom:clamp(0px, calc(var(--lvl-to, 0) * 1% - 14px), calc(100% - var(--ice-h)));
    display:flex; justify-content:center; align-items:flex-end; gap:3px;
    flex-wrap:wrap; padding:0 2px; pointer-events:none;
    animation:iceRise var(--rise-dur, 0s) ease-out var(--rise-delay, 0s) both;
  }
  @keyframes iceRise{
    from{bottom:clamp(0px, calc(var(--lvl-from, 0) * 1% - 14px), calc(100% - var(--ice-h)));}
    to{bottom:clamp(0px, calc(var(--lvl-to, 0) * 1% - 14px), calc(100% - var(--ice-h)));}
  }
  .ice-cube{
    width:20px; height:20px; flex-shrink:0;
    background:rgba(255,255,255,.5); border:2px solid rgba(255,255,255,.85);
    box-shadow:inset -3px -3px 0 rgba(255,255,255,.2);
  }
  .ice-cube.big{width:40px; height:40px;}
  .ice-cubes{--ice-h:30px;}
  .ice-big{--ice-h:40px;}
  .ice-crushed{--ice-h:24px;}
  .ice-cubes > :nth-child(2){margin-bottom:8px;}
  .ice-shard{
    width:8px; height:8px; flex-shrink:0;
    background:rgba(255,255,255,.55); border:1px solid rgba(255,255,255,.8);
  }
  .glass-tick{
    position:absolute; right:-9px; width:9px; height:2px; z-index:4;
  }
  .legend{position:relative; flex:1; min-width:0; max-width:190px; display:flex; flex-direction:column; gap:8px; justify-content:center;}
  .legend-row{display:flex; align-items:center; gap:6px;}
  .legend-swatch{width:10px; height:10px; flex-shrink:0; border:1px solid rgba(255,255,255,.35);}
  .legend-text{font-size:14px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .glass-legend{color:var(--dim); font-size:14px; text-align:center; margin-bottom:14px;}

  /* ---------- Bicchiere consigliato (sempre visibile) ---------- */
  .glass-tag{
    display:flex; align-items:center; gap:8px; justify-content:center;
    color:var(--text); font-size:16px; margin-bottom:10px;
  }
  .mini-glass-icon{
    display:inline-block; width:16px; height:20px; flex-shrink:0;
    border:2px solid var(--cyan); border-top:none; background:rgba(0,232,255,.12);
  }
  .mini-glass-icon.shape-coupe{width:22px; height:13px; border-radius:0 0 11px 11px / 0 0 13px 13px;}
  .mini-glass-icon.shape-highball{width:11px; height:22px;}

  /* ---------- Palco del contenitore: vaso + animazioni sovrapposte ---------- */
  .vessel-stage{position:relative; display:inline-block; flex-shrink:0;}
  .vessel{
    position:relative; overflow:hidden;
    border:4px solid var(--cyan); border-top:none; background:rgba(255,255,255,.03);
    box-shadow:0 0 16px rgba(0,232,255,.35);
  }
  .vessel.v-tumbler{width:110px; height:130px;}
  .vessel.v-coupe{width:130px; height:90px; border-radius:0 0 70px 70px / 0 0 90px 90px;}
  .vessel.v-highball{width:80px; height:150px;}
  .vessel.v-shaker{width:76px; height:140px; border-radius:6px 6px 26px 26px;}
  .vessel.v-mixing{width:96px; height:150px;}

  @keyframes vesselShake{
    0%,100%{transform:translateX(0) rotate(0deg);}
    10%{transform:translateX(-6px) rotate(-7deg);}
    20%{transform:translateX(6px) rotate(7deg);}
    30%{transform:translateX(-6px) rotate(-6deg);}
    40%{transform:translateX(6px) rotate(6deg);}
    50%{transform:translateX(-5px) rotate(-5deg);}
    60%{transform:translateX(5px) rotate(5deg);}
    70%{transform:translateX(-4px) rotate(-3deg);}
    80%{transform:translateX(4px) rotate(3deg);}
    90%{transform:translateX(-2px) rotate(-1deg);}
  }
  .vessel.shaking{animation:vesselShake .35s infinite;}

  .stir-ring{
    position:absolute; top:10px; left:50%; width:26px; height:26px;
    margin-left:-13px; border:3px dashed var(--yellow); border-radius:50%;
    animation:stirSpin .8s linear infinite; z-index:4;
  }
  @keyframes stirSpin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }

  .ice-scoop{
    position:absolute; top:2px; right:-8px; width:26px; height:18px; z-index:6;
    background:linear-gradient(to bottom, #d8e1ea, #99a7b6);
    border:2px solid #fff;
    clip-path:polygon(18% 0, 100% 0, 82% 100%, 0% 100%);
    animation:scoopMove 1.2s ease-in-out 1;
  }
  @keyframes scoopMove{
    0%{ transform:translate(46px,-14px) rotate(0deg); opacity:0; }
    28%{ transform:translate(0,-8px) rotate(0deg); opacity:1; }
    55%{ transform:translate(0,-8px) rotate(0deg); opacity:1; }
    78%{ transform:translate(0,-8px) rotate(-40deg); opacity:1; }
    100%{ transform:translate(46px,-14px) rotate(-40deg); opacity:0; }
  }
  /* il ghiaccio cade dall'alto fino al fondo (o sul pelo del liquido) */
  @keyframes iceDrop{ from{transform:translateY(-140px);} to{transform:translateY(0);} }
  .ice[data-animate="1"] .ice-cube,
  .ice[data-animate="1"] .ice-shard{ animation: iceDrop .5s cubic-bezier(.5,0,.9,.6) .6s both; }
  .ice[data-animate="1"] > :nth-child(3n+2){ animation-delay:.72s; }
  .ice[data-animate="1"] > :nth-child(3n){ animation-delay:.84s; }

  /* gli strati di liquido crescono dal basso mentre la bottiglia versa */
  .layer.new{ animation:layerGrow .45s ease-out var(--d, .5s) both; }
  @keyframes layerGrow{ from{height:0%;} to{height:var(--h);} }
  .glass-tick.new{ animation:tickIn .2s linear var(--d2, 1s) both; }
  @keyframes tickIn{ from{opacity:0;} to{opacity:1;} }

  /* ---------- Guarnizioni ---------- */
  .garnish{position:absolute; z-index:7; pointer-events:none;}
  .garnish.new{animation:garnishDrop .7s ease-out both;}
  @keyframes garnishDrop{ from{opacity:0; transform:translateY(-34px) rotate(-25deg);} to{opacity:1; transform:none;} }
  .g-orangeTwist, .g-lemonTwist{right:10px; top:-14px; width:30px; height:24px; --tw:#ff9a1f;}
  .g-lemonTwist{--tw:#ffe45e;}
  .g-orangeTwist::before, .g-lemonTwist::before{
    content:''; position:absolute; left:0; top:0; width:20px; height:20px;
    border:4px solid var(--tw); border-radius:50%;
    border-bottom-color:transparent; border-left-color:transparent; transform:rotate(-20deg);
  }
  .g-orangeTwist::after, .g-lemonTwist::after{
    content:''; position:absolute; left:11px; top:7px; width:17px; height:5px;
    background:var(--tw); border-radius:3px; transform:rotate(28deg);
  }
  .g-cherry{
    left:50%; margin-left:-7px; top:2px; width:14px; height:14px; border-radius:50%;
    background:#e0143c; box-shadow:inset -3px -3px 0 rgba(0,0,0,.28), inset 2px 2px 0 rgba(255,255,255,.35);
  }
  .g-cherry::before{
    content:''; position:absolute; left:8px; top:-10px; width:2px; height:11px;
    background:#4a9a35; transform:rotate(25deg);
  }
  .g-limeWheel{
    right:6px; top:-12px; width:26px; height:26px; border-radius:50%;
    border:3px solid #6fcf2a;
    background:repeating-conic-gradient(#d4f58a 0 30deg, #a6df52 30deg 60deg);
  }
  .g-mintSprig{left:50%; margin-left:-13px; top:-18px; width:26px; height:24px;
    background:linear-gradient(#3b8d2f,#3b8d2f) 12px 8px/2px 16px no-repeat;}
  .g-mintSprig::before, .g-mintSprig::after{
    content:''; position:absolute; top:2px; width:13px; height:9px; background:#4fc23a;
  }
  .g-mintSprig::before{left:0; border-radius:70% 0 70% 0; transform:rotate(-25deg);}
  .g-mintSprig::after{left:12px; border-radius:0 70% 0 70%; transform:rotate(25deg);}
  .g-saltRim{
    left:-2px; right:-2px; top:-3px; height:6px;
    background:repeating-linear-gradient(90deg,#ffffff 0 3px,#cfd8e3 3px 4px,transparent 4px 6px);
  }

  .pour-row{
    position:absolute; top:-44px; left:0; right:0; z-index:6; height:44px;
    display:flex; justify-content:center; gap:12px; pointer-events:none;
  }
  .pour-unit{position:relative; width:14px; height:44px;}
  .pour-bottle{
    position:absolute; top:2px; left:2px; width:10px; height:24px; border-radius:2px;
    transform-origin:center center; animation:pourTilt 1.4s ease-in-out 1;
  }
  .pour-bottle::before{
    content:''; position:absolute; left:50%; top:-7px; width:4px; height:7px;
    transform:translateX(-50%); background:inherit;
  }
  .pour-stream{
    position:absolute; left:50%; top:30px; width:3px; height:0; margin-left:-1px; opacity:0;
    animation:streamFlow 1.4s ease-in-out 1;
  }
  @keyframes pourTilt{
    0%{ transform:rotate(0deg); }
    30%{ transform:rotate(180deg); }
    75%{ transform:rotate(180deg); }
    100%{ transform:rotate(0deg); }
  }
  @keyframes streamFlow{
    0%,28%{height:0; opacity:0;}
    38%{height:30px; opacity:.95;}
    70%{height:30px; opacity:.95;}
    80%,100%{height:0; opacity:0;}
  }
  .step-counter{
    text-align:center; color:var(--yellow); font-family:'Press Start 2P', monospace;
    font-size:11px; margin-bottom:10px;
  }
  .step-box{
    background:var(--bg-panel); border:2px solid var(--pink);
    padding:16px; margin-bottom:14px; font-size:20px;
  }
  .step-tag{
    display:inline-block; font-family:'Press Start 2P', monospace; font-size:8px;
    color:var(--bg); background:var(--pink); padding:3px 6px; margin-bottom:10px;
  }
  .action-btn{
    display:block; width:100%; padding:14px; margin-bottom:10px; cursor:pointer;
    font-family:'Press Start 2P', monospace; font-size:11px; border:none; color:#04240f;
    background:var(--green); box-shadow:0 4px 0 #1a7d43;
  }
  .action-btn:active{transform:translateY(4px); box-shadow:none;}
  .action-btn:disabled{background:var(--grid); color:var(--dim); box-shadow:none; cursor:default;}
  .action-btn.secondary{background:var(--yellow); box-shadow:0 4px 0 #a88a10;}
  .timer-bar-outer{
    height:18px; border:2px solid var(--yellow); background:var(--bg-panel); margin-bottom:12px;
  }
  .timer-bar-inner{height:100%; width:0%; background:var(--yellow); transition:width linear;}
  .flavor-text{
    text-align:center; color:var(--green); font-family:'Press Start 2P', monospace;
    font-size:10px; min-height:20px; margin-bottom:6px;
  }
  .tool-list{color:var(--dim); font-size:16px; margin-bottom:14px;}
  .tool-list .missing{color:var(--pink);}
  .guest-note{color:var(--cyan); font-size:15px; margin-top:6px;}

  /* ---------- Basi ---------- */
  .card{
    background:var(--bg-panel); border:1px solid var(--grid); padding:14px; margin-bottom:14px;
  }
  .card h3{color:var(--yellow); font-size:12px; margin:0 0 8px;}
  .card p{margin:0; font-size:18px;}
  .calc-check{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
  .calc-check input{width:18px; height:18px; accent-color:var(--cyan);}
  .calc-check label{font-size:17px;}
  .calc-item{border-bottom:1px solid var(--grid); padding-bottom:10px; margin-bottom:10px;}
  .calc-controls{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin:8px 0 0 26px;}
  .calc-controls button{
    width:24px; height:24px; background:var(--bg-panel-2); color:var(--yellow);
    border:2px solid var(--yellow); font-family:'Press Start 2P', monospace; font-size:9px; cursor:pointer;
  }
  .calc-label{font-size:14px; color:var(--dim);}
  .calc-val{font-size:16px; color:var(--yellow); min-width:16px; text-align:center;}
  .result-line{display:flex; justify-content:space-between; font-size:18px; border-bottom:1px dashed var(--grid); padding:5px 0;}
  .result-line b{color:var(--cyan);}

  /* ---------- Musica ---------- */
  .text-input{
    width:100%; padding:9px 10px; background:var(--bg); border:2px solid var(--grid);
    color:var(--text); font-family:'VT323', monospace; font-size:17px; margin-bottom:10px;
  }
  .text-input:focus{outline:none; border-color:var(--cyan);}

  /* ---------- Now playing bar (solo versione self-hosted con Spotify vero) ---------- */
  .now-playing-bar{
    position:fixed; bottom:0; left:0; right:0; z-index:40;
    max-width:480px; margin:0 auto;
    background:var(--bg-panel); border-top:2px solid var(--green);
    padding:8px 14px; display:none; align-items:center; gap:10px;
  }
  .now-playing-bar img{width:32px; height:32px; flex-shrink:0;}
  .now-playing-bar .np-text{
    font-size:14px; color:var(--text); overflow:hidden;
    white-space:nowrap; text-overflow:ellipsis;
  }
  body.has-now-playing #app{padding-bottom:64px;}

  /* ====================== NUOVE FORME DI BICCHIERE ====================== */
  .vessel-fill{position:absolute; inset:0;}
  .vessel.v-martini{
    width:140px; height:100px; border:none; background:var(--cyan);
    clip-path:polygon(0 0, 100% 0, 50% 100%); box-shadow:none;
  }
  .vessel.v-martini .vessel-fill{

/* ======================================================================
   CATALOGO IBA COMPLETO (102 cocktail ufficiali, lista 2024)
   Gli 8 cocktail "scritti a mano" qui sopra restano com'erano; gli altri 94
   sono descritti in formato compatto (funzione R) e gli step guidati vengono
   generati da ibaBuildCocktail().

   Formato ingredienti (separati da spazio):  chiave:quantita[unita]
     unita: nessuna = cl, d = dash, p = pezzi, f = foglie
     prefissi: ^ = si aggiunge alla fine (top)   ~ = si pesta per primo (muddle)
               % = risciacquo del bicchiere       _ = affonda sul fondo (solo grafica)
   Metodi: build, muddleBuild, stir, shake, shakeEgg, shakeDirty, muddleShake
   ====================================================================== */

const CAT_LABELS = { U:'UNFORGETTABLES', C:'CONTEMPORARY', N:'NEW ERA' };
const TIER_ORDER = { base:0, standard:1, premium:2 };
const TIER_LABELS = { base:'BASE', standard:'STANDARD', premium:'PREMIUM' };

// Gruppo di appartenenza (per il filtro "per spirito"); a parita vince il primo della lista
const SPIRIT_GROUPS = [
  { id:'whisky',  label:'WHISKY',  inv:['bourbon','rye','scotch','irishWhiskey'] },
  { id:'gin',     label:'GIN',     inv:['gin'] },
  { id:'rum',     label:'RUM',     inv:['rum','rumScuro','cachaca'] },

  { id:'amari',   label:'AMARI',   inv:['campari','aperol','fernet','cynar','amaroNonino'] },
  { id:'vini',    label:'VINI / BOLLICINE', inv:['spumante','vinoBianco','vinoRosso','sherry','porto','vermouthRosso','vermouthSecco','lillet'] },
];

const GLASS_INV = { tumbler:'tumbler', coupe:'coupe', highball:'highball', martini:'martini', flute:'flute', calice:'calice', mug:'mug' };

const ICE_TEXT = {
  big: "Riempi il bicchiere con un grosso cubo di ghiaccio.",

};

function ibaShortLabel(inv){ return (INV_LABELS[inv] || inv).split(' / ')[0].split(' (')[0]; }

function ibaParseIng(tok){
  const o = { top:false, muddle:false, rinse:false, sink:false, garnish:false };
  while('^~%_'.indexOf(tok[0]) >= 0){
    if(tok[0]==='^') o.top = true;
    else if(tok[0]==='~') o.muddle = true;
    else if(tok[0]==='%') o.rinse = true;
    else o.sink = true;
    tok = tok.slice(1);
  }
  const parts = tok.split(':');
  const m = parts[1].match(/^([\d.]+)([dpf]?)$/);
  o.inv = parts[0];
  o.amount = parseFloat(m[1]);
  o.unit = m[2]==='d' ? 'dash' : m[2]==='p' ? 'pz' : m[2]==='f' ? 'foglie' : 'cl';
  o.label = INV_LABELS[o.inv];
  return o;
}

function ibaGarnishIng(inv){
  return { inv, amount:1, unit:'pz', label:INV_LABELS[inv], top:false, muddle:false, rinse:false, sink:false, garnish:true };
}

function ibaPhrase(i){
  const L = ibaShortLabel(i.inv);
  if(i.unit==='cl') return `{${i.inv}}cl di ${L}`;
  if(i.unit==='dash') return `{${i.inv}} dash di ${L}`;
  if(i.unit==='foglie') return `{${i.inv}} foglie di ${L}`;
  return `{${i.inv}} pz di ${L}`;
}

function ibaJoin(parts){
  if(parts.length < 2) return parts[0] || '';
  return parts.slice(0,-1).join(', ') + ' e ' + parts[parts.length-1];
}

function ibaChunk(arr, n){
  const out = [];
  for(let i=0;i<arr.length;i+=n) out.push(arr.slice(i,i+n));
  return out;
}

function ibaComputeSpirit(ings){
  const tot = {};
  ings.forEach(i=>{
    if(i.unit!=='cl' || i.rinse || i.garnish) return;
    const g = SPIRIT_GROUPS.find(g=>g.inv.indexOf(i.inv) >= 0);
    if(g) tot[g.id] = (tot[g.id]||0) + i.amount;
  });
  let best = null, bestV = 0;
  SPIRIT_GROUPS.forEach(g=>{ if((tot[g.id]||0) > bestV){ best = g.id; bestV = tot[g.id]; } });
  return best || 'altro';
}

function ibaBuildCocktail(r){
  const ings = r.ings.split(' ').map(ibaParseIng);
  ings.forEach(i=>{ if(!i.label) throw new Error('Ingrediente sconosciuto: '+i.inv+' in '+r.id); });

  const gar = (r.gar && r.gar!=='none') ? r.gar : null;
  const gi = gar ? GARNISH_INFO[gar] : null;
  if(gar && !gi) throw new Error('Guarnizione sconosciuta: '+gar+' in '+r.id);
  if(gi && gi.inv && !ings.some(i=>i.inv===gi.inv)) ings.push(ibaGarnishIng(gi.inv));
  if(r.rim==='sugar' && !ings.some(i=>i.inv==='zucchero')) ings.push(ibaGarnishIng('zucchero'));

  const m = r.m;
  const isShake = m.indexOf('shake')===0 || m==='muddleShake';
  const isStir = m==='stir';
  const isBuild = m==='build' || m==='muddleBuild';
  const mixVessel = isShake ? 'shaker' : isStir ? 'mixing' : 'glass';
  const mixWhere = isShake ? 'nello shaker' : isStir ? 'nel mixing glass' : 'nel bicchiere';
  const serveIce = r.ice || 'none';

  const rinse = ings.filter(i=>i.rinse);
  const muddled = ings.filter(i=>i.muddle);
  const mainIngs = ings.filter(i=>!i.top && !i.muddle && !i.rinse && !i.garnish);
  const tops = ings.filter(i=>i.top);

  const steps = [];
  let curIce = 'none';
  const push = (tag, vessel, reveal, text, extra)=>{
    steps.push(Object.assign({ tag, vessel, reveal, ice:curIce, text }, extra||{}));
  };

  if(r.rim){
    const salt = r.rim==='salt';
    push('RIM','glass',[],
      salt ? "Bagna il bordo del bicchiere con uno spicchio di lime e passalo nel sale grosso."
           : "Bagna il bordo del bicchiere con uno spicchio di limone e passalo nello zucchero.",
      { garnish: salt ? 'saltRim' : 'sugarRim' });
  }
  if(rinse.length){
    push('RINSE','glass',[],
      `Risciacqua il bicchiere con ${ibaJoin(rinse.map(ibaPhrase))}: ruotalo per rivestire le pareti ed elimina l'eccesso.`);
  }
  if(muddled.length){
    push('MUDDLE', mixVessel, muddled.map(i=>i.inv),
      `Metti ${ibaJoin(muddled.map(ibaPhrase))} ${mixWhere} e pesta delicatamente.`);
  }
  if(isBuild && !muddled.length && serveIce!=='none'){
    curIce = serveIce;
    push('GHIACCIO','glass',[], ICE_TEXT[serveIce]);
  }

  ibaChunk(mainIngs, 3).forEach(ch=>{
    push('VERSA', mixVessel, ch.map(i=>i.inv), `Versa ${ibaJoin(ch.map(ibaPhrase))} ${mixWhere}.`);
  });

  const pushTops = ()=> tops.forEach(t=> push('TOP','glass',[t.inv], `Completa con ${ibaPhrase(t)}.`));

  if(isBuild){
    if(muddled.length && serveIce!=='none'){
      curIce = serveIce;
      push('GHIACCIO','glass',[], ICE_TEXT[serveIce]);
    }
    const stir = ()=> { if(!r.ns) push('STIR','glass',[], 'Mescola delicatamente per 8 secondi.', { duration:8 }); };
    if(r.sb) stir();
    pushTops();
    if(!r.sb) stir();
  } else if(isStir){
    push('STIR','mixing',[], 'Aggiungi ghiaccio nel mixing glass e mescola per 20 secondi.', { duration:20, ice:'cubes' });
    curIce = serveIce;
    push('STRAIN','glass',[], serveIce!=='none' ? 'Filtra nel bicchiere con ghiaccio.' : 'Filtra nel bicchiere freddo, senza ghiaccio.');
    pushTops();
  } else {
    if(m==='shakeEgg'){
      push('SHAKE','shaker',[], "Dry shake: shakera senza ghiaccio per 8 secondi per emulsionare l'uovo.", { duration:8, ice:'none' });
    }
    push('SHAKE','shaker',[], 'Aggiungi ghiaccio e shakera per 12 secondi.', { duration:12, ice:'cubes' });
    curIce = serveIce;
    if(m==='shakeDirty'){
      push('STRAIN','glass',[], 'Versa tutto, ghiaccio compreso, nel bicchiere.');
    } else {
      const fine = m==='muddleShake' ? 'con doppio filtro (strainer + colino fine) ' : 'con lo strainer ';
      push('STRAIN','glass',[], 'Filtra ' + fine + (serveIce!=='none' ? 'nel bicchiere con ghiaccio.' : 'nel bicchiere freddo, senza ghiaccio.'));
    }
    pushTops();
  }

  if(gar) push('GARNISH','glass',[], gi.text, { garnish: gar });

  const tools = ['jigger'];
  if(isStir) tools.push('mixingGlass','barSpoon','strainer');
  else if(isShake) tools.push('shaker','strainer');
  else tools.push('barSpoon');
  if(muddled.length) tools.push('muddler');
  tools.push(GLASS_INV[r.g]);
  if(gi && gi.tool) tools.push(gi.tool);

  return {
    id: r.id, name: r.name, cat: r.c, tier: r.t,
    glassShape: 'shape-' + r.g,
    tools: tools.filter((t,i)=>tools.indexOf(t)===i),
    extraTools: r.rim==='salt' ? ['saleRim'] : [],
    ingredients: ings,
    steps,
    spirit: ibaComputeSpirit(ings),
  };
}

const IBA_RECIPES = [];
function R(id, name, c, t, g, m, ice, ings, gar, opts){
  IBA_RECIPES.push(Object.assign({ id, name, c, t, g, m, ice, ings, gar }, opts || {}));
}

/* ============ HELPERS ============ */

function round(n){ return Math.round(n*10)/10; }

function scaleAmount(ing, guests){
  const raw = ing.amount * guests;
  if(ing.unit==='cl') return round(raw);
  return Math.round(raw);
}

function isCocktailReady(cocktail){
  const needed = [...cocktail.tools, ...(cocktail.extraTools||[]), ...cocktail.ingredients.map(i=>i.inv)];
  return needed.every(k => !!state.inventory[k]);
}

function missingItems(cocktail){
  const needed = [...cocktail.tools, ...(cocktail.extraTools||[]), ...cocktail.ingredients.map(i=>i.inv)];
  const uniq = [...new Set(needed)];
  return uniq.filter(k => !state.inventory[k]);
}

function fillTemplate(text, cocktail, guests){
  return text.replace(/\{(\w+)\}/g, (m, key)=>{
    const found = cocktail.ingredients.find(i=>i.inv===key);
    if(!found) return m;
    return String(scaleAmount(found, guests));
  });
}

function glassShapeClass(shape){
  if(shape==='shape-coupe') return 'glass shape-coupe';
  if(shape==='shape-highball') return 'glass shape-highball';
  return 'glass';
}

// Costruisce gli strati colorati cumulativi nel bicchiere, in base agli ingredienti
// versati fino allo step corrente (ognuno con la sua altezza proporzionale e il suo colore)
function iceHTML(iceState, animate, vars){
  if(!iceState || iceState==='none') return '';
  const flag = animate ? ' data-animate="1"' : '';
  const v = vars || {};
  const style = ` style="--lvl-from:${(v.from||0).toFixed(1)}; --lvl-to:${(v.to||0).toFixed(1)}; --rise-dur:${(v.dur||0).toFixed(2)}s; --rise-delay:.5s;"`;
  if(iceState==='big') return `<div class="ice ice-big"${flag}${style}><div class="ice-cube big"></div></div>`;
  if(iceState==='cubes') return `<div class="ice ice-cubes"${flag}${style}>${'<div class="ice-cube"></div>'.repeat(3)}</div>`;
  if(iceState==='crushed') return `<div class="ice ice-crushed"${flag}${style}>${'<div class="ice-shard"></div>'.repeat(9)}</div>`;
  return '';
}

// Guarnizioni accumulate fino allo step corrente (visibili solo sul bicchiere di servizio)
function garnishHTML(cocktail, stepIndex){
  if(cocktail.steps[stepIndex].vessel !== 'glass') return '';
  const items = [];
  for(let i=0;i<=stepIndex;i++){
    const g = cocktail.steps[i].garnish;
    if(g && !items.some(x=>x.type===g)) items.push({type:g, isNew:i===stepIndex});
  }
  return items.map(it=>`<div class="garnish g-${it.type}${it.isNew?' new':''}"></div>`).join('');
}

// Una bottiglietta colorata per ciascun ingrediente versato in QUESTO step (non cumulativo),
// con un'animazione di inclinazione + rivolo, per mostrare visivamente il versamento
function pourRowHTML(step, cocktail, guests){
  const revealed = step.reveal || [];
  if(!revealed.length) return '';
  const units = revealed.map((inv, idx)=>{
    const ingredient = cocktail.ingredients.find(i=>i.inv===inv);
    if(!ingredient) return '';
    const color = COLORS[inv] || '#cccccc';
    const delay = (idx*0.45).toFixed(2);
    return `<div class="pour-unit">
      <div class="pour-bottle" style="background:${color}; animation-delay:${delay}s;"></div>
      <div class="pour-stream" style="background:${color}; animation-delay:${delay}s;"></div>
    </div>`;
  }).join('');
  return `<div class="pour-row">${units}</div>`;
}

function iceScoopHTML(step){
  if(step.tag !== 'GHIACCIO') return '';
  return `<div class="ice-scoop"></div>`;
}

function stirRingHTML(step, timerRunning){
  if(step.tag !== 'STIR' || !timerRunning) return '';
  return `<div class="stir-ring"></div>`;
}

/* ============ SPOTIFY (richiede hosting esterno: qui le chiamate a account.spotify.com
   e api.spotify.com funzionano perché non c'è più la sandbox di Claude) ============ */

function randomString(len){
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  let out = '';
  const values = crypto.getRandomValues(new Uint8Array(len));
  values.forEach(v => out += chars[v % chars.length]);
  return out;
}

async function sha256Base64Url(plain){
  const data = new TextEncoder().encode(plain);
  const digest = await crypto.subtle.digest('SHA-256', data);
  let str = '';
  new Uint8Array(digest).forEach(b => str += String.fromCharCode(b));
  return btoa(str).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

function spotifyRedirectUri(){
  return window.location.origin + window.location.pathname;
}

async function spotifyLogin(){
  if(!state.spotifyClientId){ return; }
  const verifier = randomString(64);
  sessionStorage.setItem('sp_verifier', verifier);
  const challenge = await sha256Base64Url(verifier);
  const params = new URLSearchParams({
    client_id: state.spotifyClientId,
    response_type: 'code',
    redirect_uri: spotifyRedirectUri(),
    scope: 'user-read-currently-playing',
    code_challenge_method: 'S256',
    code_challenge: challenge,
  });
  window.location.href = 'https://accounts.spotify.com/authorize?' + params.toString();
}

async function spotifyHandleRedirect(){
  const url = new URL(window.location.href);
  const code = url.searchParams.get('code');
  if(!code) return;
  const verifier = sessionStorage.getItem('sp_verifier');
  try{
    const res = await fetch('https://accounts.spotify.com/api/token', {
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body: new URLSearchParams({
        client_id: state.spotifyClientId,
        grant_type:'authorization_code',
        code,
        redirect_uri: spotifyRedirectUri(),
        code_verifier: verifier || '',
      }),
    });
    const data = await res.json();
    if(data.access_token){
      state.spotifyToken = data.access_token;
      state.spotifyRefresh = data.refresh_token || state.spotifyRefresh;
      state.spotifyExpiresAt = Date.now() + (data.expires_in||3600)*1000;
      persistData();
    }
  }catch(e){ /* login Spotify non riuscito */ }
  window.history.replaceState({}, document.title, spotifyRedirectUri());
}

async function spotifyRefreshToken(){
  if(!state.spotifyRefresh || !state.spotifyClientId) return null;
  try{
    const res = await fetch('https://accounts.spotify.com/api/token', {
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body: new URLSearchParams({
        client_id: state.spotifyClientId,
        grant_type:'refresh_token',
        refresh_token: state.spotifyRefresh,
      }),
    });
    const data = await res.json();
    if(data.access_token){
      state.spotifyToken = data.access_token;
      if(data.refresh_token) state.spotifyRefresh = data.refresh_token;
      state.spotifyExpiresAt = Date.now() + (data.expires_in||3600)*1000;
      persistData();
      return state.spotifyToken;
    }
  }catch(e){ /* refresh non riuscito */ }
  return null;
}

function spotifyLogout(){
  state.spotifyToken = null;
  state.spotifyRefresh = null;
  state.spotifyExpiresAt = 0;
  state.nowPlaying = null;
  persistData();
  updateNowPlayingBar();
}

let nowPlayingTimer = null;

async function fetchNowPlaying(){
  if(!state.spotifyToken) return;
  if(Date.now() > state.spotifyExpiresAt - 5000){
    await spotifyRefreshToken();
    if(!state.spotifyToken) return;
  }
  try{
    const res = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
      headers:{Authorization:'Bearer '+state.spotifyToken},
    });
    if(res.status===204){
      state.nowPlaying = null;
    } else if(res.status===401){
      await spotifyRefreshToken();
    } else if(res.ok){
      const data = await res.json();
      state.nowPlaying = (data && data.item) ? {
        track: data.item.name,
        artist: data.item.artists.map(a=>a.name).join(', '),
        image: (data.item.album.images[2]||data.item.album.images[0]||{}).url,
        isPlaying: data.is_playing,
      } : null;
    }
  }catch(e){ /* rete non disponibile in questo momento */ }
  updateNowPlayingBar();
  if(state.view==='music') render();
}

function startNowPlayingPolling(){
  if(nowPlayingTimer) return;
  fetchNowPlaying();
  nowPlayingTimer = setInterval(fetchNowPlaying, 8000);
}

function updateNowPlayingBar(){
  const bar = document.getElementById('now-playing-bar');
  if(!bar) return;
  if(state.spotifyToken && state.nowPlaying){
    document.body.classList.add('has-now-playing');
    bar.style.display = 'flex';
    bar.innerHTML = `
      ${state.nowPlaying.image ? `<img src="${state.nowPlaying.image}" alt="">` : ''}
      <span class="np-text">${state.nowPlaying.isPlaying?'▶':'⏸'} ${state.nowPlaying.track} — ${state.nowPlaying.artist}</span>
    `;
  } else {
    document.body.classList.remove('has-now-playing');
    bar.style.display = 'none';
  }
}

/* ============ AUDIO ============ */

function playCoinSound(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    const now = ctx.currentTime;
    const notes = [988, 1319]; // classico "cha-ching" da cabinato arcade
    notes.forEach((freq, i)=>{
      const t0 = now + i*0.09;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(freq, t0);
      gain.gain.setValueAtTime(0.18, t0);
      gain.gain.exponentialRampToValueAtTime(0.001, t0+0.14);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0+0.15);
    });
  }catch(e){ /* audio non disponibile su questo dispositivo/browser */ }
}

/* ============ TIMER ============ */

function startTimer(duration){
  state.timer = {running:true, interval:null, seconds:0, total:duration};
  render();
  state.timer.interval = setInterval(()=>{
    state.timer.seconds += 0.1;
    const bar = document.querySelector('.timer-bar-inner');
    if(state.timer.seconds >= state.timer.total){
      state.timer.seconds = state.timer.total;
      state.timer.running = false;
      clearInterval(state.timer.interval);
      render(); // solo ora serve un ridisegno completo (sblocca il pulsante, ferma le animazioni)
    } else if(bar){
      // aggiorno solo la barra, senza ridisegnare tutto: cosi' le animazioni di
      // shaker/mescolare restano fluide invece di essere riavviate ogni 100ms
      bar.style.width = Math.min(100, (state.timer.seconds/state.timer.total)*100) + '%';
    } else {
      render();
    }
  }, 100);
}

function clearTimerState(){
  if(state.timer.interval) clearInterval(state.timer.interval);
  state.timer = {running:false, interval:null, seconds:0, total:0};
}

/* ======================================================================
   PROGRESSIONE, SBLOCCHI, CORSO, CODICI SEGRETI
   ====================================================================== */

function defaultProgress(){
  return {
    points:0,
    lessonsDone:{},
    unlocked:{},
    work:{},
    cheats:{ money:false, lessons:false, premium:false, all:false },
  };
}

function normalizeProgress(p){
  const out = Object.assign(defaultProgress(), p || {});
  out.cheats = Object.assign(defaultProgress().cheats, (p && p.cheats) || {});
  out.lessonsDone = out.lessonsDone || {};
  out.unlocked = out.unlocked || {};
  out.work = out.work || {};
  return out;
}

function isFree(c){ return FREE_IDS.indexOf(c.id) >= 0; }

function isUnlocked(c){
  const p = state.progress;
  return isFree(c) || !!p.unlocked[c.id] || p.cheats.all || (p.cheats.premium && c.tier==='premium');
}

// Si puo aprire se sbloccato, oppure se aperto da una lezione (accesso temporaneo)
function canAccess(c){ return isUnlocked(c) || state.tempAccess===c.id; }

function costOf(c){ return COST[c.tier]; }
function canAfford(c){ return state.progress.cheats.money || state.progress.points >= costOf(c); }
function pointsLabel(){ return state.progress.cheats.money ? '∞' : String(state.progress.points); }

function unlockCocktail(c){
  if(isUnlocked(c)) return true;
  if(!canAfford(c)) return false;
  if(!state.progress.cheats.money) state.progress.points -= costOf(c);
  state.progress.unlocked[c.id] = true;
  persistData();
  return true;
}

function lessonUnlocked(i){
  return state.progress.cheats.lessons || i===0 || !!state.progress.lessonsDone[LESSONS[i-1].id];
}

function lessonWork(l){
  const w = state.progress.work;
  if(!w[l.id]) w[l.id] = { ex:[], quiz:false, cocktail:false };
  return w[l.id];
}

function lessonReady(l){
  const w = lessonWork(l);
  const exOk = l.ex.every((_, i)=> !!w.ex[i]);
  const cockOk = !l.cocktail || !!w.cocktail;
  return exOk && cockOk && !!w.quiz;
}

function spiritLabel(id){
  const g = SPIRIT_GROUPS.find(g=>g.id===id);
  return g ? g.label : 'ALTRO';
}

function escapeAttr(s){ return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

function applyCheatCode(raw){
  const code = String(raw||'').toUpperCase().replace(/[^A-Z]/g,'');
  const hit = CHEAT_CODES[code];
  if(!hit){ state.codeMsg = 'CODICE NON VALIDO. Riprova.'; state.codeOk = false; return; }
  if(hit.key==='reset'){ state.progress = defaultProgress(); state.basiSelection = {}; }
  else state.progress.cheats[hit.key] = true;
  state.codeMsg = hit.msg;
  state.codeOk = true;
  persistData();
}

function matchesFilter(c){
  const f = state.filter;
  if(f.tier!=='all' && c.tier!==f.tier) return false;
  if(f.spirit!=='all' && c.spirit!==f.spirit) return false;
  if(f.status==='unlocked' && !isUnlocked(c)) return false;
  if(f.status==='locked' && isUnlocked(c)) return false;
  if(f.status==='ready' && !(isUnlocked(c) && isCocktailReady(c))) return false;
  if(f.q && c.name.toLowerCase().indexOf(f.q.toLowerCase()) < 0) return false;
  return true;
}

function sortedCocktails(){
  return COCKTAILS.slice().sort((a,b)=>{
    const ua = isUnlocked(a) ? 0 : 1, ub = isUnlocked(b) ? 0 : 1;
    if(ua!==ub) return ua-ub;
    if(a.tier!==b.tier) return TIER_ORDER[a.tier]-TIER_ORDER[b.tier];
    return a.name.localeCompare(b.name);
  });
}

/* ======================================================================
   GRAFICA DEL BICCHIERE: strati (con risciacquo e ingredienti che affondano)
   ====================================================================== */

function buildLayers(cocktail, uptoStepIndex, guests){
  const revealedOrder = [];
  for(let i=0;i<=uptoStepIndex;i++){
    (cocktail.steps[i].reveal||[]).forEach(inv=>{
      if(!revealedOrder.includes(inv)) revealedOrder.push(inv);
    });
  }
  // Chi "affonda" (granatina, crème de mûre...) si disegna sul fondo, anche se si versa per ultimo
  const isSink = inv => { const g = cocktail.ingredients.find(i=>i.inv===inv); return !!(g && g.sink); };
  revealedOrder.sort((a,b)=> (isSink(a)?0:1) - (isSink(b)?0:1));

  // Il totale si calcola sull'intera ricetta finale (non solo su cio' che e' stato
  // versato finora), cosi' il livello cresce in proporzione reale.
  const volByInv = {};
  let total = 0;
  cocktail.ingredients.forEach(ingredient=>{
    let vol = 0;
    if(ingredient.rinse) vol = 0;
    else if(ingredient.unit==='cl') vol = ingredient.amount;
    else if(ingredient.unit==='dash') vol = ingredient.amount*NOMINAL_DASH_CL;
    volByInv[ingredient.inv] = vol;
    total += vol;
  });
  const maxFill = 85;
  let cumBottom = 0;
  const layers = [];
  revealedOrder.forEach(inv=>{
    const vol = volByInv[inv];
    if(!vol) return;
    const ingredient = cocktail.ingredients.find(i=>i.inv===inv);
    const heightPct = total>0 ? (vol/total)*maxFill : 0;
    const bottomPct = cumBottom;
    cumBottom += heightPct;
    layers.push({
      inv, bottomPct, heightPct, topPct:cumBottom,
      color: COLORS[inv] || '#cccccc',
      label: ingredient.label,
      amountDisplay: scaleAmount(ingredient, guests) + (ingredient.unit==='dash' ? ' dash' : ingredient.unit)
    });
  });
  return layers;
}

function renderDetail(){
  const c = COCKTAILS.find(c=>c.id===state.currentCocktailId);
  if(!c) return hudHTML() + screenHeader('COCKTAIL','goto-cocktails','‹ LISTA') + `<div class="inv-note">Cocktail non trovato.</div>`;
  const step = c.steps[state.stepIndex];
  const total = c.steps.length;
  const isLast = state.stepIndex === total-1;
  const fromLesson = !!(state.backTo && state.backTo.view==='lesson');
  const miss = missingItems(c);
  const layers = buildLayers(c, state.stepIndex, state.guests);
  const prevLayers = state.stepIndex>0 ? buildLayers(c, state.stepIndex-1, state.guests) : [];
  const lvlFrom = prevLayers.length ? prevLayers[prevLayers.length-1].topPct : 0;
  const lvlTo = layers.length ? layers[layers.length-1].topPct : 0;
  const newInvs = step.reveal || [];
  const newCount = layers.filter(l=>newInvs.includes(l.inv)).length;

  let html = hudHTML() + (fromLesson
    ? screenHeader(c.name.toUpperCase(), 'back-to-lesson', '‹ LEZIONE')
    : screenHeader(c.name.toUpperCase(), 'goto-cocktails', '‹ LISTA'));
  html += `<div style="display:flex; justify-content:flex-end; margin:-8px 0 10px;">
      <button class="back-btn" data-action="restart-cocktail" style="border-color:var(--yellow); color:var(--yellow);">RICOMINCIA</button>
    </div>`;

  const glassInfo = GLASS_INFO[c.glassShape] || GLASS_INFO['shape-tumbler'];
  html += `<div class="glass-tag"><span class="mini-glass-icon ${glassInfo.iconClass}"></span>Bicchiere consigliato: <b style="color:var(--cyan);">${glassInfo.name}</b></div>`;

  const vClass = step.vessel==='shaker' ? 'v-shaker' : step.vessel==='mixing' ? 'v-mixing' : glassInfo.vClass;
  const isShaking = step.tag==='SHAKE' && state.timer.running;
  const vesselLabel = step.vessel==='shaker' ? 'SHAKER' : step.vessel==='mixing' ? 'MIXING GLASS' : glassInfo.name.toUpperCase();
  const hasHandle = step.vessel==='glass' && c.glassShape==='shape-mug';

  html += `<div class="glass-row">
      <div class="vessel-stage ${hasHandle?'has-handle':''}">
        ${pourRowHTML(step, c, state.guests)}
        ${iceScoopHTML(step)}
        <div class="vessel ${vClass} ${isShaking?'shaking':''}">
          <div class="vessel-fill">
            ${layers.map(l=>{
              const k = newInvs.indexOf(l.inv);
              const d = (0.5 + Math.max(0,k)*0.45).toFixed(2);
              return `<div class="layer${k>=0?' new':''}" style="bottom:${l.bottomPct}%; height:${l.heightPct}%; --h:${l.heightPct}%; --d:${d}s; background:${l.color};"></div>`;
            }).join('')}
            ${iceHTML(step.ice, step.tag==='GHIACCIO', {from:lvlFrom, to:lvlTo, dur:0.45*newCount})}
            ${stirRingHTML(step, state.timer.running)}
          </div>
        </div>
        ${garnishHTML(c, state.stepIndex)}
      </div>
      <div class="legend">
        ${[...layers].reverse().map(l=>`
          <div class="legend-row">
            <span class="legend-swatch" style="background:${l.color};"></span>
            <span class="legend-text">${l.label} — ${l.amountDisplay}</span>
          </div>
        `).join('')}
      </div>
    </div>`;
  html += `<div class="glass-legend">Ora stai lavorando nel: <b style="color:var(--text);">${vesselLabel}</b>. Il colore e l'altezza di ogni strato corrispondono al vero ingrediente versato.</div>`;

  if(miss.length){
    html += `<div class="tool-list">Ti manca ancora: <span class="missing">${miss.map(m=>INV_LABELS[m]).join(', ')}</span></div>`;
  }

  html += `<div class="step-counter">STAGE ${state.stepIndex+1} / ${total}</div>`;

  html += `<div class="step-box">
      <span class="step-tag">${step.tag}</span><br>
      ${fillTemplate(step.text, c, state.guests)}
    </div>`;

  if(state.guests>2 && (step.tag==='SHAKE')){
    html += `<div class="guest-note">Consiglio: con più di 2 persone shakera in 2-3 lotti separati, resta più freddo ed equilibrato.</div>`;
  }

  const finishLabel = fromLesson ? 'FINE! ▶ TORNA ALLA LEZIONE' : 'FINE! ▶ TORNA AI COCKTAIL';
  if(step.duration){
    const t = state.timer;
    const pct = t.total ? Math.min(100, (t.seconds/t.total)*100) : 0;
    html += `<div class="timer-bar-outer"><div class="timer-bar-inner" style="width:${pct}%;"></div></div>`;
    if(!t.running && t.seconds===0){
      html += `<button class="action-btn secondary" data-action="start-timer">AVVIA (${step.duration}s)</button>`;
    } else if(t.running){
      html += `<div class="flavor-text">IN CORSO...</div>`;
      html += `<button class="action-btn" disabled>ATTENDI...</button>`;
    } else {
      html += `<div class="flavor-text">PERFETTO!</div>`;
      html += `<button class="action-btn" data-action="${isLast?'finish-cocktail':'next-step'}">${isLast?finishLabel:'STEP SUCCESSIVO ▶'}</button>`;

  }

  if(state.stepIndex>0){
    html += `<button class="action-btn secondary" data-action="prev-step">◀ STEP PRECEDENTE</button>`;
  }

  return html;
}

/* ======================================================================
   BASI: tecniche + calcolo serata (ogni cocktail con persone e drink a testa)

function renderBasi(){
  let html = hudHTML() + screenHeader('BASI');

  BASI_INFO.forEach(b=>{
    html += `<div class="card"><h3>${b.title}</h3><p>${b.text}</p></div>`;
  });

  html += `<div class="card">
    <h3>CALCOLA LA SERATA</h3>
    <p style="margin-bottom:10px;">Aggiungi i cocktail della serata (solo quelli sbloccati): per ognuno imposti persone e drink a testa, e l'app somma le quantità totali.</p>
  `;

  const selectedIds = Object.keys(state.basiSelection).filter(id=>state.basiSelection[id].selected);
  const available = sortedCocktails().filter(c=>isUnlocked(c) && selectedIds.indexOf(c.id)<0);
  if(available.length){
    html += `<div style="display:flex;gap:8px;margin:10px 0;align-items:stretch;">
      <select id="basi-add" class="text-input" style="margin:0;flex:1;">
        ${available.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}
      </select>
      <button class="chip on" data-action="basi-add">AGGIUNGI</button>
    </div>`;
  }

  selectedIds.forEach(id=>{
    const c = COCKTAILS.find(c=>c.id===id);
    const item = state.basiSelection[id];
    if(!c) return;
    html += `<div class="calc-item">
      <div class="calc-check" style="justify-content:space-between;">
        <label style="flex:1;">${c.name}</label>
        <button class="chip" data-action="basi-remove" data-id="${c.id}">TOGLI</button>
      </div>
      <div class="calc-controls">
        <span class="calc-label">Persone</span>
        <button data-action="basi-guest-minus" data-id="${c.id}">-</button>
        <span class="calc-val">${item.guests}</span>
        <button data-action="basi-guest-plus" data-id="${c.id}">+</button>
        <span class="calc-label">A testa</span>
        <button data-action="basi-drinks-minus" data-id="${c.id}">-</button>
        <span class="calc-val">${item.perPerson}</span>
        <button data-action="basi-drinks-plus" data-id="${c.id}">+</button>
      </div>
    </div>`;
  });

  if(selectedIds.length){
    const totals = {};
    selectedIds.forEach(id=>{
      const c = COCKTAILS.find(c=>c.id===id);
      if(!c) return;
      const item = state.basiSelection[id];
      const multiplier = item.guests * item.perPerson;
      c.ingredients.forEach(i=>{
        const amt = scaleAmount(i, multiplier);
        const key = i.inv + '|' + i.unit;
        if(!totals[key]) totals[key] = { inv:i.inv, amount:0, unit:i.unit, label:i.label };
        totals[key].amount += amt;
      });
    });
    html += `<div style="margin-top:14px;">`;
    Object.keys(totals).sort((a,b)=> totals[a].label.localeCompare(totals[b].label)).forEach(key=>{
      const t = totals[key];
      let extra = '';
      if(t.unit==='cl' && t.inv==='lime') extra = ` (≈ ${Math.ceil(t.amount/LIME_YIELD)} lime)`;
      if(t.unit==='cl' && t.inv==='limone') extra = ` (≈ ${Math.ceil(t.amount/LEMON_YIELD)} limoni)`;
      if(t.unit==='cl' && t.inv==='sciroppo') extra = ` — prepara almeno ${Math.ceil((t.amount*10)/50)*50}ml di sciroppo`;
      const u = t.unit==='pz' ? ' pz' : t.unit==='dash' ? ' dash' : t.unit==='foglie' ? ' foglie' : t.unit;
      html += `<div class="result-line"><span>${t.label}${extra}</span><b>${round(t.amount)}${u}</b></div>`;
    });
    html += `</div>`;
  } else {
    html += `<div class="inv-note">Aggiungi almeno un cocktail per vedere le quantità totali.</div>`;
  }

  html += `</div>`;
  return html;
}

/* ======================================================================
   CORSO: elenco lezioni e lezione
   ====================================================================== */

function renderCourse(){
  const done = LESSONS.filter(l=>state.progress.lessonsDone[l.id]).length;
  const pct = Math.round(done/LESSONS.length*100);
  let html = hudHTML() + screenHeader('CORSO');
  html += `<div class="card">
    <h3>IL TUO PERCORSO</h3>
    <p>Lezioni completate: <b>${done}/${LESSONS.length}</b> · Punti: <b>${pointsLabel()}</b></p>
    <div class="progress-outer"><div class="progress-inner" style="width:${pct}%;"></div></div>
    <p style="margin-top:8px;font-size:16px;color:var(--dim);">Ogni lezione dà punti. Con i punti sblocchi i cocktail: BASE ${COST.base} pt, STANDARD ${COST.standard} pt, PREMIUM ${COST.premium} pt. Le lezioni si sbloccano una dopo l'altra.</p>
  </div>`;
  let lastModule = -1;
  LESSONS.forEach((l,i)=>{
    if(l.m!==lastModule){
      html += `<div class="module-title pixel">MODULO ${l.m+1} · ${COURSE_MODULES[l.m]}</div>`;
      lastModule = l.m;
    }
    const open = lessonUnlocked(i);
    const dn = !!state.progress.lessonsDone[l.id];
    html += `<div class="lesson-row ${dn?'done':''} ${open?'':'locked'}" ${open ? `data-action="open-lesson" data-id="${l.id}"` : ''}>
      <div class="lesson-title">${i+1}. ${l.t}</div>
      <span class="lesson-pts">${dn ? 'FATTA' : open ? '+'+l.pts+' PT' : 'BLOCCATA'}</span>
    </div>`;
  });
  return html;
}

function renderLesson(){
  const idx = LESSONS.findIndex(l=>l.id===state.currentLessonId);
  const l = LESSONS[idx];
  if(!l) return hudHTML() + screenHeader('CORSO','goto-course','‹ CORSO');
  const w = lessonWork(l);
  const done = !!state.progress.lessonsDone[l.id];

  let html = hudHTML() + screenHeader(`LEZIONE ${idx+1}`, 'goto-course', '‹ CORSO');
  html += `<div class="card">
    <h3>${l.t}</h3>
    <div class="inv-note" style="margin:0 0 8px;">MODULO ${l.m+1} · ${COURSE_MODULES[l.m]} · +${l.pts} PT</div>
    <p>${l.text}</p>
  </div>`;

  if(l.needs.length){
    html += `<div class="card"><h3>COSA TI SERVE</h3>
      ${l.needs.map(k=>`<div class="${state.inventory[k]?'need-ok':'need-miss'}">${state.inventory[k]?'✓':'✗'} ${INV_LABELS[k]}</div>`).join('')}
      <div class="inv-note" style="margin-bottom:0;">Segna in SCORTE quello che hai in casa.</div>
    </div>`;
  }

  html += `<div class="card"><h3>ESERCIZI</h3>`;
  l.ex.forEach((t,i)=>{
    html += `<div class="inv-row ${w.ex[i]?'checked':''}">
      <input type="checkbox" id="ex-${i}" data-ex="${i}" ${w.ex[i]?'checked':''}>
      <label for="ex-${i}">${t}</label>
    </div>`;
  });
  if(l.cocktail){
    const c = COCKTAILS.find(c=>c.id===l.cocktail);
    html += `<div class="inv-row ${w.cocktail?'checked':''}">
      <span style="width:20px;color:var(--green);">${w.cocktail?'✓':'•'}</span>
      <label style="flex:1;">Prepara ${c.name} seguendo la guida, fino alla fine</label>
    </div>
    <button class="action-btn secondary" data-action="open-lesson-cocktail" data-id="${c.id}">▶ APRI LA GUIDA: ${c.name.toUpperCase()}</button>`;
  }
  html += `</div>`;

  html += `<div class="card"><h3>QUIZ</h3><p style="margin-bottom:10px;">${l.q.q}</p>`;
  l.q.o.forEach((o,i)=>{
    html += `<button class="quiz-opt ${w.quiz && i===l.q.a ? 'right' : ''}" data-action="quiz-answer" data-i="${i}" ${w.quiz?'disabled':''}>${o}</button>`;
  });
  if(w.quiz) html += `<div class="flavor-text">RISPOSTA ESATTA!</div>`;
  else if(state.lessonMsg) html += `<div class="flavor-text" style="color:var(--pink);">${state.lessonMsg}</div>`;
  html += `</div>`;

  if(done){
    html += `<div class="flavor-text">LEZIONE COMPLETATA</div>`;
    if(idx < LESSONS.length-1){
      html += `<button class="action-btn" data-action="open-lesson" data-id="${LESSONS[idx+1].id}">PROSSIMA LEZIONE ▶</button>`;
    }
  } else {
    const ready = lessonReady(l);
    html += `<button class="action-btn" data-action="complete-lesson" ${ready?'':'disabled'}>COMPLETA LEZIONE (+${l.pts} PT)</button>`;
    if(!ready){
      html += `<div class="inv-note">Spunta tutti gli esercizi, rispondi bene al quiz${l.cocktail ? ' e completa la guida del cocktail' : ''} per completare la lezione.</div>`;
    }
  }
  return html;
}

function renderCodes(){
  let html = hudHTML() + screenHeader('CODICI SEGRETI');
  html += `<div class="card">
    <h3>CHEAT CODE</h3>
    <p style="margin-bottom:10px;">Come nei cabinati anni 80: inserisci un codice segreto (in inglese, senza spazi o con, non fa differenza) e vedi cosa succede.</p>
    <input type="text" class="text-input" id="code-input" placeholder="Scrivi il codice..." autocomplete="off" autocapitalize="characters">
    <button class="action-btn" data-action="submit-code">INVIA CODICE</button>
    ${state.codeMsg ? `<div class="flavor-text" style="color:${state.codeOk?'var(--green)':'var(--pink)'};">${state.codeMsg}</div>` : ''}
  </div>`;
  const ch = state.progress.cheats;
  const active = [];
  if(ch.money) active.push('Punti infiniti');
  if(ch.lessons) active.push('Tutte le lezioni sbloccate');
  if(ch.premium) active.push('Cocktail premium sbloccati');
  if(ch.all) active.push('Tutti i cocktail sbloccati');
  html += `<div class="card"><h3>CODICI ATTIVI</h3>${active.length ? active.map(a=>`<div class="need-ok">✓ ${a}</div>`).join('') : `<p style="color:var(--dim);">Nessun codice attivo.</p>`}</div>`;
  return html;
}

/* ======================================================================
   AZIONI EXTRA (gestite prima dello switch principale)
   ====================================================================== */

function handleExtraAction(action, target){
  switch(action){
    case 'goto-menu':
      clearTimerState();
      state.backTo = null; state.tempAccess = null; state.unlockConfirm = null;
      state.view = 'menu'; render(); return true;
    case 'goto-cocktails':
      clearTimerState();
      state.backTo = null; state.tempAccess = null;
      state.view = 'cocktails'; render(); return true;
    case 'goto-course':
      clearTimerState();
      state.backTo = null; state.tempAccess = null;
      state.view = 'course'; render(); return true;
    case 'goto-codes':
      state.codeMsg = ''; state.view = 'codes'; render(); return true;
    case 'filter':
      state.filter[target.dataset.group] = target.dataset.value;
      render(); return true;
    case 'open-cocktail': {
      const c = COCKTAILS.find(c=>c.id===target.dataset.id);
      if(!c) return true;
      if(canAccess(c)){
        clearTimerState();
        state.backTo = null;
        state.currentCocktailId = c.id;
        state.stepIndex = 0;
        state.view = 'detail';
      } else {
        state.unlockConfirm = (state.unlockConfirm===c.id) ? null : c.id;
      }
      render(); return true;
    }
    case 'unlock-do': {
      const c = COCKTAILS.find(c=>c.id===target.dataset.id);
      if(c && unlockCocktail(c)) state.unlockConfirm = null;
      render(); return true;
    }
    case 'unlock-cancel':
      state.unlockConfirm = null; render(); return true;
    case 'open-lesson': {
      const i = LESSONS.findIndex(l=>l.id===target.dataset.id);
      if(i>=0 && lessonUnlocked(i)){
        state.currentLessonId = LESSONS[i].id;
        state.lessonMsg = '';
        state.view = 'lesson';
      }
      render(); return true;
    }
    case 'open-lesson-cocktail': {
      clearTimerState();
      state.backTo = { view:'lesson', id:state.currentLessonId };
      state.tempAccess = target.dataset.id;
      state.currentCocktailId = target.dataset.id;
      state.stepIndex = 0;
      state.view = 'detail';
      render(); return true;
    }
    case 'back-to-lesson':
      clearTimerState();
      if(state.backTo) state.currentLessonId = state.backTo.id;
      state.backTo = null; state.tempAccess = null;
      state.view = 'lesson'; render(); return true;
    case 'finish-cocktail': {
      clearTimerState();
      if(state.backTo && state.backTo.view==='lesson'){
        const l = LESSONS.find(l=>l.id===state.backTo.id);
        if(l && l.cocktail===state.currentCocktailId){ lessonWork(l).cocktail = true; persistData(); }
        state.currentLessonId = state.backTo.id;
        state.backTo = null; state.tempAccess = null;
        state.view = 'lesson';
      } else {
        state.tempAccess = null;
        state.view = 'cocktails';
      }
      render(); return true;
    }
    case 'quiz-answer': {
      const l = LESSONS.find(l=>l.id===state.currentLessonId);
      if(!l) return true;
      if(parseInt(target.dataset.i,10)===l.q.a){ lessonWork(l).quiz = true; state.lessonMsg = ''; persistData(); }
      else state.lessonMsg = 'Risposta sbagliata, riprova!';
      render(); return true;
    }
    case 'complete-lesson': {
      const l = LESSONS.find(l=>l.id===state.currentLessonId);
      if(l && lessonReady(l) && !state.progress.lessonsDone[l.id]){
        state.progress.lessonsDone[l.id] = true;
        state.progress.points += l.pts;
        persistData();
      }
      render(); return true;
    }
    case 'submit-code': {
      const input = document.getElementById('code-input');
      applyCheatCode(input ? input.value : '');
      render(); return true;
    }
    case 'basi-add': {
      const sel = document.getElementById('basi-add');
      if(sel && sel.value){
        const id = sel.value;
        if(!state.basiSelection[id]) state.basiSelection[id] = { selected:false, guests:state.guests, perPerson:1 };
        state.basiSelection[id].selected = true;
      }
      render(); return true;
    }
    case 'basi-remove': {
      const it = state.basiSelection[target.dataset.id];
      if(it) it.selected = false;
      render(); return true;
    }
  }
  return false;
}

// Casella di ricerca: aggiorna solo la lista, senza perdere il focus
app.addEventListener('input', (e)=>{
  if(e.target && e.target.id==='cocktail-search'){
    state.filter.q = e.target.value;
    const box = document.getElementById('cocktail-items');
    if(box) box.innerHTML = cocktailItemsHTML();
  }
});

// Invio sul campo codice
app.addEventListener('keydown', (e)=>{
  if(e.key==='Enter' && e.target && e.target.id==='code-input'){
    applyCheatCode(e.target.value);
    render();
  }
});

// Esercizi della lezione
app.addEventListener('change', (e)=>{
  if(e.target && e.target.dataset && e.target.dataset.ex !== undefined){
    const l = LESSONS.find(l=>l.id===state.currentLessonId);
    if(l){
      lessonWork(l).ex[parseInt(e.target.dataset.ex,10)] = e.target.checked;
      persistData();
      render();
    }
  }
});

/* ============ EVENTS ============ */

app.addEventListener('click', (e)=>{
  const target = e.target.closest('[data-action]');
  if(!target) return;
  const action = target.dataset.action;
  if(handleExtraAction(action, target)) return;

  switch(action){
    case 'start':
      playCoinSound();
      state.view = 'menu'; render(); break;
    case 'goto-menu':
      clearTimerState();
      state.view = 'menu'; render(); break;
    case 'goto-inventory':
      state.view = 'inventory'; render(); break;
    case 'goto-cocktails':
      state.view = 'cocktails'; render(); break;
    case 'goto-basi':
      state.view = 'basi'; render(); break;
    case 'goto-music':
      state.view = 'music'; render(); break;
    case 'open-spotify-search': {
      const q = encodeURIComponent('retro 8-bit videogame music 80s 90s');
      window.open(`https://open.spotify.com/search/${q}`, '_blank', 'noopener');
      break;
    }
    case 'open-my-music':
      if(state.musicLink) window.open(state.musicLink, '_blank', 'noopener');
      break;
    case 'save-music-link': {
      const input = document.getElementById('music-link-input');
      state.musicLink = input ? input.value.trim() : '';
      persistData();
      render();
      break;
    }
    case 'save-spotify-client': {
      const input = document.getElementById('spotify-client-input');
      state.spotifyClientId = input ? input.value.trim() : '';
      persistData();
      render();
      break;
    }
    case 'spotify-login':
      spotifyLogin();
      break;
    case 'spotify-logout':
      spotifyLogout();
      render();
      break;
    case 'guest-plus':
      state.guests = Math.min(8, state.guests+1); persistData(); render(); break;
    case 'guest-minus':
      state.guests = Math.max(1, state.guests-1); persistData(); render(); break;
    case 'basi-guest-plus': {
      const item = state.basiSelection[target.dataset.id];
      if(item) item.guests = Math.min(20, item.guests+1);
      render(); break;
    }
    case 'basi-guest-minus': {
      const item = state.basiSelection[target.dataset.id];
      if(item) item.guests = Math.max(1, item.guests-1);
      render(); break;
    }
    case 'basi-drinks-plus': {
      const item = state.basiSelection[target.dataset.id];
      if(item) item.perPerson = Math.min(10, item.perPerson+1);
      render(); break;
    }
    case 'basi-drinks-minus': {
      const item = state.basiSelection[target.dataset.id];
      if(item) item.perPerson = Math.max(1, item.perPerson-1);
      render(); break;
    }
    case 'open-cocktail':
      clearTimerState();
      state.currentCocktailId = target.dataset.id;
      state.stepIndex = 0;
      state.view = 'detail'; render(); break;
    case 'next-step': {
      const c = COCKTAILS.find(c=>c.id===state.currentCocktailId);
      clearTimerState();
      state.stepIndex = Math.min(c.steps.length-1, state.stepIndex+1);
      render(); break;
    }
    case 'prev-step':
      clearTimerState();
      state.stepIndex = Math.max(0, state.stepIndex-1);
      render(); break;
    case 'start-timer': {
      const c = COCKTAILS.find(c=>c.id===state.currentCocktailId);
      const step = c.steps[state.stepIndex];
      startTimer(step.duration);
      break;
    }
    case 'restart-cocktail':
      clearTimerState();
      state.stepIndex = 0;
      render(); break;
    case 'finish-cocktail':
      clearTimerState();
      state.view = 'cocktails'; render(); break;
  }
});

app.addEventListener('change', (e)=>{
  if(e.target.dataset.inv){
    state.inventory[e.target.dataset.inv] = e.target.checked;
    persistData();
    render();
  }
  if(e.target.dataset.basi){
    const id = e.target.dataset.basi;
    if(!state.basiSelection[id]) state.basiSelection[id] = {selected:false, guests: state.guests, perPerson:1};
    state.basiSelection[id].selected = e.target.checked;
    render();
  }
});

/* ============ INIT ============ */

loadData();
spotifyHandleRedirect().then(()=>{
  render();
  if(state.spotifyToken) startNowPlayingPolling();
});
render();
</script>
